<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盲人辅助系统</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Vision Language Navigation</p>
        <h1 class="hero-title">盲人辅助系统</h1>
      </header>

      <section class="toolbar">
        <button class="mode-tab" data-mode="debug">图片导航模式</button>
        <button class="mode-tab is-active" data-mode="formal">视频导航模式</button>
        <button id="speakLatest" class="voice-button" type="button" disabled>语音播报</button>
        <button id="stopSpeech" class="voice-button ghost" type="button">停止播报</button>
        <select id="providerSelect" class="simple-select">
          <option value="openai">OpenAI</option>
          <option value="qwen">Qwen3.6 Plus</option>
          <option value="gemini">Gemini</option>
          <option value="kimi">Kimi</option>
          <option value="zhipu">ZhipuAI</option>
        </select>
      </section>

      <section class="panel mode-panel is-hidden" data-panel="debug">
        <div class="panel-head">
          <h2>图片导航</h2>
          <p>上传一张图片，返回稳定的场景分析结果。</p>
        </div>

        <div class="grid">
          <div class="card">
            <label class="field">
              <span>任务类型</span>
              <select id="debugTask">
                <option value="scene_description">场景描述</option>
                <option value="navigation_guidance">寻路指导</option>
                <option value="general_assistance">综合辅助</option>
              </select>
            </label>

            <label class="field">
              <span>我的问题</span>
              <textarea id="debugText" rows="4" placeholder="例如：前方是否安全？我应该往哪里走？"></textarea>
            </label>
            <div class="speech-input-row">
              <button id="debugSpeechInput" class="voice-button speech-input-button" type="button" data-target="debugText">
                语音输入
              </button>
              <span id="debugSpeechStatus" class="speech-status">等待语音输入</span>
            </div>

            <label class="field">
              <span>上传图片</span>
              <input id="debugImage" type="file" accept="image/*" />
            </label>

            <button id="debugAnalyze" class="primary-button">开始调试分析</button>
          </div>

          <div class="card result-card">
            <div class="preview-wrap">
              <img id="debugPreview" alt="调试图片预览" />
            </div>
            <div id="debugResult" class="result-box result-empty">上传图片后，将在这里显示导航建议。</div>
          </div>
        </div>
      </section>

      <section class="panel mode-panel" data-panel="formal">
        <div class="panel-head">
          <h2>视频导航</h2>
          <p>实时摄像头帧 + 文字输入，持续输出描述或寻路指令。</p>
        </div>

        <div class="grid">
          <div class="card">
            <label class="field">
              <span>任务类型</span>
              <select id="formalTask">
                <option value="navigation_guidance">寻路指导</option>
                <option value="scene_description">场景描述</option>
                <option value="general_assistance">综合辅助</option>
              </select>
            </label>

            <label class="field">
              <span>我的问题</span>
              <textarea id="formalText" rows="4" placeholder="例如：持续提醒我前方障碍，必要时告诉我停下或转向。"></textarea>
            </label>
            <div class="speech-input-row">
              <button id="formalSpeechInput" class="voice-button speech-input-button" type="button" data-target="formalText">
                语音输入
              </button>
              <span id="formalSpeechStatus" class="speech-status">等待语音输入</span>
            </div>

            <label class="field">
              <span>基础间隔（毫秒）</span>
              <input id="formalInterval" type="number" min="800" step="100" value="1500" />
            </label>

            <div class="hint-row">
              <span id="formalEventBadge" class="hint-chip" data-event="idle">等待启动</span>
              <span id="formalNextIntervalBadge" class="hint-chip">下一轮 1500ms</span>
              <span id="formalSessionBadge" class="hint-chip">会话未启动</span>
              <span class="hint-chip subtle">空格：开始 / 暂停 / 继续</span>
              <span class="hint-chip subtle">S：播报当前结果</span>
              <span class="hint-chip subtle">X：停止播报</span>
              <span class="hint-chip subtle">- / +：调整基础间隔</span>
            </div>

            <div class="quick-action-row">
              <button id="formalSpeakLatest" class="voice-button" type="button" disabled aria-keyshortcuts="S">
                播报当前结果
              </button>
              <button id="formalStopSpeech" class="voice-button ghost" type="button" aria-keyshortcuts="X">
                停止播报
              </button>
              <button id="formalIntervalDown" class="secondary-button" type="button" aria-keyshortcuts="-">
                更快 -100ms
              </button>
              <button id="formalIntervalUp" class="secondary-button" type="button" aria-keyshortcuts="+">
                更慢 +100ms
              </button>
            </div>

            <div class="button-row">
              <button id="startCamera" class="secondary-button">打开摄像头</button>
              <button id="startFormal" class="primary-button">开始实时分析</button>
              <button id="stopFormal" class="secondary-button">停止</button>
            </div>
          </div>

          <div class="card result-card">
            <div class="video-wrap">
              <video id="formalVideo" autoplay muted playsinline></video>
              <canvas id="formalCanvas" hidden></canvas>
            </div>
            <div class="live-summary">
              <p id="formalStatus" data-tone="info">正式模式待启动。按空格即可开始实时分析。</p>
              <div id="formalResult" class="result-box result-empty">启动摄像头后，将在这里显示实时导航结果。</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
