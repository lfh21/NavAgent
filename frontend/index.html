<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blind Assist Demo</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Vision Language Navigation</p>
        <h1 class="hero-title">盲人辅助系统 Web Demo</h1>
        <p class="hero-copy">
          双模式界面：Debug 模式用于单图调试，Formal 模式用于实时视频帧 + 文字输入，持续输出场景描述或寻路指令。
        </p>
      </header>

      <section class="toolbar">
        <button class="mode-tab is-active" data-mode="debug">Debug 模式</button>
        <button class="mode-tab" data-mode="formal">Formal 模式</button>
        <button id="speakLatest" class="voice-button" type="button" disabled>语音播报</button>
        <button id="stopSpeech" class="voice-button ghost" type="button">停止播报</button>
        <select id="providerSelect" class="simple-select">
          <option value="mock">Mock Demo</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">Qwen3.6 Plus</option>
          <option value="zhipu">ZhipuAI</option>
        </select>
      </section>

      <section class="panel mode-panel" data-panel="debug">
        <div class="panel-head">
          <h2>Debug</h2>
          <p>上传一张图片，返回稳定的场景分析结果。</p>
        </div>

        <div class="grid">
          <div class="card">
            <label class="field">
              <span>任务类型</span>
              <select id="debugTask">
                <option value="scene_description">场景描述</option>
                <option value="navigation_guidance">寻路指导</option>
                <option value="general_assistance">综合辅助</option>
              </select>
            </label>

            <label class="field">
              <span>用户文字</span>
              <textarea id="debugText" rows="4" placeholder="例如：请描述前方环境，告诉我是否安全。"></textarea>
            </label>

            <label class="field">
              <span>上传图片</span>
              <input id="debugImage" type="file" accept="image/*" />
            </label>

            <button id="debugAnalyze" class="primary-button">开始调试分析</button>
          </div>

          <div class="card result-card">
            <div class="preview-wrap">
              <img id="debugPreview" alt="调试图片预览" />
            </div>
            <pre id="debugResult" class="result-box">等待调试结果…</pre>
          </div>
        </div>
      </section>

      <section class="panel mode-panel is-hidden" data-panel="formal">
        <div class="panel-head">
          <h2>Formal</h2>
          <p>实时摄像头帧 + 文字输入，持续输出描述或寻路指令。</p>
        </div>

        <div class="grid">
          <div class="card">
            <label class="field">
              <span>任务类型</span>
              <select id="formalTask">
                <option value="navigation_guidance">寻路指导</option>
                <option value="scene_description">场景描述</option>
                <option value="general_assistance">综合辅助</option>
              </select>
            </label>

            <label class="field">
              <span>实时文字输入</span>
              <textarea id="formalText" rows="4" placeholder="例如：持续告诉我前方障碍，并在需要时给我转向提示。"></textarea>
            </label>

            <label class="field">
              <span>发送间隔（毫秒）</span>
              <input id="formalInterval" type="number" min="800" step="100" value="1500" />
            </label>

            <div class="button-row">
              <button id="startCamera" class="secondary-button">打开摄像头</button>
              <button id="startFormal" class="primary-button">开始实时分析</button>
              <button id="stopFormal" class="secondary-button">停止</button>
            </div>
          </div>

          <div class="card result-card">
            <div class="video-wrap">
              <video id="formalVideo" autoplay muted playsinline></video>
              <canvas id="formalCanvas" hidden></canvas>
            </div>
            <div class="live-summary">
              <p id="formalStatus">Formal 模式待启动。</p>
              <pre id="formalResult" class="result-box">等待实时结果…</pre>
            </div>
          </div>
        </div>
      </section>

    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
